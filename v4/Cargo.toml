[package]
name = "mini-harness-v4"
version = "0.1.0"
edition = "2024"
description = "V4: a bounded coding agent with policy and human approval"

[dependencies]
anyhow = "=1.0.100"
async-trait = "=0.1.89"
dotenvy = "=0.15.7"
reqwest = { version = "=0.12.24", features = ["json", "rustls-tls", "stream"], default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tokio = { version = "=1.48.0", features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"
