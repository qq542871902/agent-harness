[package]
name = "mini-harness-v6"
version = "0.1.0"
edition = "2024"
description = "V6: a policy-checked coding agent with persistent resumable sessions"

[dependencies]
anyhow = "=1.0.100"
async-trait = "=0.1.89"
chrono = { version = "=0.4.42", features = ["serde"] }
dotenvy = "=0.15.7"
reqwest = { version = "=0.12.24", features = ["json", "rustls-tls", "stream"], default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tokio = { version = "=1.48.0", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "time"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter"] }
uuid = { version = "=1.18.1", features = ["v4", "serde"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"
