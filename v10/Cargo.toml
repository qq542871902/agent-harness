[package]
name = "mini-harness-v10"
version = "0.1.0"
edition = "2024"
description = "V10: controlled lexical, vector, and hybrid workspace retrieval on the V9 harness runtime"

[dependencies]
anyhow = "=1.0.100"
async-trait = "=0.1.89"
mini-harness-v9 = { path = "../v9" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
reqwest = { version = "=0.12.24", features = ["json", "rustls-tls", "stream"], default-features = false }
tokio = { version = "=1.48.0", features = ["io-std", "macros", "rt-multi-thread", "signal", "sync"] }
tracing-subscriber = { version = "=0.3.20", features = ["env-filter"] }
uuid = { version = "=1.18.1", features = ["v4"] }
